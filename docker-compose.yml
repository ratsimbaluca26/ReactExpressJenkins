version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: tahiana
      POSTGRES_PASSWORD: jenkinsdb
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend Express.js
  backend:
    build: ./server
    container_name: express-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://tahiana:jenkinsdb@db:5432/mydatabase
      PORT: 5000
    depends_on:
      - db

  # Frontend React (Nginx)
  frontend:
    build: ./client
    container_name: react-app
    restart: always
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  pgdata: